name: Release

# Publishes to npm when a GitHub Release is published.
# Auth is via npm Trusted Publishing (OIDC) — NO long-lived NPM_TOKEN.
# The trusted publisher must be configured once on npmjs.com for this
# package, pointing at repo gachlab/capacitor-background-geolocation and
# workflow file `release.yml`.
on:
  release:
    types: [published]

jobs:
  publish:
    name: Build and publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      # Trusted Publishing (OIDC) needs npm >= 11.5.1. node 24 already ships
      # npm 11.x, so this is a floor, not an upgrade — it keeps the guarantee
      # explicit if the bundled npm ever moves.
      #
      # Pinned to a major on purpose. This step used to be `npm@latest` on node
      # 20, and it rotted without anyone touching it: npm 12 shipped requiring
      # node ^22.22.2 || ^24.15.0 || >=26, so the install started failing with
      # EBADENGINE and took the v3.0.1 release down with it. `@latest` next to a
      # pinned node is a time bomb — the floating side eventually outgrows the
      # frozen one. Bump this deliberately, together with node-version.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      # No NODE_AUTH_TOKEN: npm detects the GitHub OIDC environment and
      # authenticates via the configured trusted publisher. Provenance is
      # attached automatically.
      - run: npm publish --access public
